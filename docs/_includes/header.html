<div id="particles-js">
  <div class="header">

    <div class="content-logo tanimation kago">
      <img src="{{ '/PhaciusKeyLogo_240.PNG' | relative_url }}" alt="PhaciusKey logo" height="180" width="180">
    </div>

    <h1 class="tanimation keader">
      <span class="site-title">{{ site.title }}</span>
      <span class="site-description">{{ site.description }}</span>
    </h1>

   <div class="download">
    <a href="{{ site.repo }}/releases/latest" title="Tải về cho macOS" rel="nofollow">
      <i class="fa fa-apple"></i>&nbsp;&nbsp;<span>v{{ site.version }}</span></a>
    <a href="{{ site.repo }}" title="Mã nguồn trên GitHub" rel="nofollow">
      <i class="fa fa-github"></i>&nbsp;&nbsp;<span>Mã nguồn</span></a>
  </div>

    <div class="header-icons tanimation">
      <a aria-label="GitHub" target="_blank" rel="noopener" href="{{ site.repo }}"><i class="icon fa fa-github" aria-hidden="true"></i></a>
      <a aria-label="Báo lỗi" target="_blank" rel="noopener" href="{{ site.repo }}/issues"><i class="icon fa fa-bug" aria-hidden="true"></i></a>
    </div>

  </div>

  <a href="#noidung" class="pk-scroll-hint" aria-label="Xem thêm thông tin">&#8964;</a>

</div>
