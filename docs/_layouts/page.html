<!DOCTYPE html>
<html lang="vi">
  {% include head.html %}
  <body>
    <div class="aurora" aria-hidden="true"><span class="a-jade"></span><span class="a-gilt"></span><span class="a-teal"></span></div>
    <div class="grain" aria-hidden="true"></div>

    <nav class="pk-nav glass">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/PhaciusKeyLogo_240.PNG' | relative_url }}" alt="" width="28" height="28">
        PhaciusKey
      </a>
      <div class="links">
        <a href="{{ '/' | relative_url }}">Trang chủ</a>
        <a href="{{ site.repo }}" target="_blank" rel="noopener">GitHub</a>
      </div>
      <a class="nav-dl" href="{{ site.repo }}/releases/download/v{{ site.version }}/PhaciusKey-{{ site.version }}.dmg">Tải về</a>
    </nav>

    <div class="pk-page-wrap">
      <article class="pk-article glass">
        {{ content }}
      </article>
    </div>

    <footer class="pk-footer">
      <nav>
        <a href="{{ '/' | relative_url }}">Trang chủ</a> ·
        <a href="{{ '/privacy.html' | relative_url }}">Chính sách bảo mật</a> ·
        <a href="{{ site.repo }}" target="_blank" rel="noopener">GitHub</a>
      </nav>
      <p>&copy; 2026 Phacius — PhaciusKey, bộ gõ tiếng Việt mã nguồn mở. Giấy phép MIT.</p>
    </footer>
  </body>
</html>
