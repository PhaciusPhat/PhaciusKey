name: Pages

# Builds the website (docs/, Jekyll) and deploys it to GitHub Pages. Replaces
# the legacy "deploy from a branch" builder, which reports failures with no
# usable error message — here the build log is a normal Actions log.
on:
  push:
    branches: ["main"]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages deployments can lag well past deploy-pages' 10-minute default
    # when GitHub's Pages backend is degraded; give a slow deploy 30 minutes
    # to land instead of aborting it.
    timeout-minutes: 35
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
