name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust — test + clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --all
      # `--locked` is deliberately absent: Cargo.lock is gitignored, so a fresh
      # clone has none to lock to. Committing it (standard for an application,
      # and what makes a signed release reproducible) is the prerequisite.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  windows:
    name: Rust — Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Build only the vnkey shell (the Windows platform module is still an
      # untested scaffold; this catches compile regressions on Windows).
      - run: cargo build -p vnkey
      # The macOS job cannot lint `platform/windows.rs`, so the workspace
      # `[lints]` table reached only half the code until this ran here.
      - run: cargo clippy -p vnkey --all-targets --all-features -- -D warnings
