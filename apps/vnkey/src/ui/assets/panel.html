<div class="surface" id="surface">
  <p class="warn" id="secure" hidden>⚠ Secure input on — typing paused</p>

  <header class="head">
    <b>PhaciusKey</b>
    <span class="ver" id="version"></span>
  </header>

  <div class="row">
    <div class="lbl"><b>Vietnamese typing</b><small id="where"></small></div>
    <span class="caps" id="shortcut"></span>
    <label class="sw"><input type="checkbox" id="enabled"><i></i></label>
  </div>
  <p class="warn" id="excluded" hidden></p>

  <hr>

  <div class="row">
    <div class="lbl"><b>Input method</b></div>
    <div class="seg" id="method">
      <button type="button" data-v="telex">Telex</button>
      <button type="button" data-v="vni">VNI</button>
    </div>
  </div>
  <div class="row">
    <div class="lbl"><b>Tone placement</b></div>
    <div class="seg" id="placement">
      <button type="button" data-v="modern">Modern</button>
      <button type="button" data-v="classic">Classic</button>
    </div>
  </div>

  <hr>

  <button class="item" id="update" type="button"></button>

  <hr>

  <div class="foot">
    <button class="item" id="settings" type="button">Settings…</button>
    <button class="item" id="quit" type="button">Quit</button>
  </div>
</div>
